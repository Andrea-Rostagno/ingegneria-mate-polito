<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain · Matematica per l'Ingegneria</title>
<meta name="description" content="Grafo interattivo delle competenze del corso di laurea in Matematica per l'Ingegneria: tutto il percorso, triennale, magistrale e ogni singolo insegnamento.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%230a0a0a' stroke-width='2'%3E%3Cpath d='M8 9 22 7 25 21 11 24Z M8 9 25 21'/%3E%3C/g%3E%3Cg fill='%230a0a0a'%3E%3Ccircle cx='8' cy='9' r='4'/%3E%3Ccircle cx='22' cy='7' r='3'/%3E%3Ccircle cx='25' cy='21' r='4'/%3E%3Ccircle cx='11' cy='24' r='3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --ground:#f2f4f7; --surface:#ffffff; --raised:#eef0f3; --border:#e3e6ea; --rule:#eef0f3;
  --control:#d4d8de; --text:#0a0a0a; --muted:#5f6670; --accent:#141414; --hue:#1d5fbf;
  --radius-card:8px; --radius-control:6px; --pad:20px; --side:300px; --detail:380px;
  --fs-title:22px; --fs-body:14px; --fs-small:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--text);font:400 var(--fs-body)/1.45 "Geist",Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:var(--side) 1fr;height:100vh;height:100dvh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:12px;align-items:center;padding:20px var(--pad) 16px}
.brand svg{flex:none}
.brand b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.brand span{display:block;color:var(--muted);font-size:var(--fs-small)}
.search{position:relative;padding:0 var(--pad)}
.search input{width:100%;height:36px;border:1px solid var(--control);border-radius:var(--radius-control);padding:0 12px;background:var(--surface);outline:none}
.search input:focus{border-color:var(--text)}
.results{position:absolute;left:var(--pad);right:var(--pad);top:40px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:0 8px 24px rgba(10,10,10,.12);max-height:320px;overflow:auto;z-index:20;display:none}
.results.open{display:block}
.results button{display:flex;width:100%;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.results button:hover,.results button.on{background:var(--raised)}
.results small{color:var(--muted);margin-left:auto;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:12px var(--pad) 8px;background:var(--raised);border-radius:var(--radius-control);padding:2px}
.seg button{border:0;background:none;height:30px;border-radius:5px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.list{overflow:auto;flex:1;padding:4px 10px 16px}
.list h2{font-size:var(--fs-small);font-weight:500;color:var(--muted);margin:14px 10px 4px}
.course{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:var(--radius-control);cursor:pointer;min-height:32px}
.course:hover{background:var(--raised)}
.course[aria-current=true]{background:var(--raised);font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.course .n{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:var(--fs-small)}
.foot{padding:12px var(--pad) 16px;border-top:1px solid var(--rule);color:var(--muted);font-size:var(--fs-small)}
.foot a{color:var(--text)}
/* main */
.main{position:relative;min-width:0;min-height:0}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:16px;padding:18px 24px;pointer-events:none;z-index:5}
.bar > *{pointer-events:auto}
.title{min-width:0;flex:1}
.title h1{font-size:var(--fs-title);font-weight:500;letter-spacing:-.015em;margin:0;line-height:1.2;display:flex;align-items:center;gap:10px}
.title p{margin:2px 0 0;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{margin-left:auto;display:flex;gap:6px}
.btn{height:34px;min-width:34px;padding:0 12px;border:1px solid var(--control);background:var(--surface);border-radius:var(--radius-control);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
.btn:hover{background:var(--raised)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:#2b2b2b}
.btn:focus-visible,.course:focus-visible,.seg button:focus-visible,.chip:focus-visible,.link:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
#menu{display:none}
canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.drag{cursor:grabbing}
canvas.hover{cursor:pointer}
.hint{position:absolute;left:24px;bottom:18px;color:var(--muted);font-size:var(--fs-small);pointer-events:none}
/* detail */
.detail{position:absolute;top:70px;right:12px;bottom:12px;width:var(--detail);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:0 8px 28px rgba(10,10,10,.10);display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));transition:transform .28s cubic-bezier(.2,.7,.2,1);z-index:10}
.detail.open{transform:none}
.dhead{padding:18px 20px 12px;display:flex;gap:12px;align-items:flex-start}
.dhead h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.25}
.dhead .area{color:var(--muted);font-size:var(--fs-small);margin-top:4px}
.dhead .btn{margin-left:auto;flex:none}
.dbody{overflow:auto;padding:0 20px 20px}
.summary{margin:0 0 16px;font-size:15px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--control);background:var(--surface);border-radius:999px;padding:3px 10px 3px 8px;cursor:pointer;font-size:13px}
.chip:hover{background:var(--raised)}
.dbody h3{font-size:13px;font-weight:500;color:var(--muted);margin:16px 0 6px}
.links{list-style:none;margin:0;padding:0}
.link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:5px 6px;margin:0 -6px;border-radius:5px;cursor:pointer}
.link:hover{background:var(--raised)}
.empty{color:var(--muted)}
.open-note{display:inline-flex;margin-top:20px;color:var(--text);font-weight:500}
@media (max-width:820px){
  :root{--pad:16px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(88vw,340px);z-index:30;transform:translateX(-102%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(10,10,10,.2)}
  #menu{display:inline-flex}
  .bar{padding:12px 16px;flex-wrap:wrap}
  .title{min-width:0;flex:1}
.title h1{font-size:18px}
  .tools .zoom{display:none}
  .detail{top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:58dvh;transform:translateY(calc(100% + 24px))}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><g stroke="#0a0a0a" stroke-width="2" fill="none"><path d="M8 9 22 7 25 21 11 24Z M8 9 25 21"/></g><g fill="#0a0a0a"><circle cx="8" cy="9" r="4"/><circle cx="22" cy="7" r="3"/><circle cx="25" cy="21" r="4"/><circle cx="11" cy="24" r="3"/></g></svg>
      <div><b>Brain</b><span>Matematica per l'Ingegneria</span></div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Cerca una competenza" autocomplete="off" aria-label="Cerca una competenza">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div class="seg" role="group" aria-label="Livello">
      <button data-level="tutto">Tutto</button><button data-level="triennale">Triennale</button><button data-level="magistrale">Magistrale</button>
    </div>
    <nav class="list" id="list" aria-label="Insegnamenti"></nav>
    <div class="foot">Progetto di uno studente, non ufficiale. Note in <a href="https://github.com/Andrea-Rostagno/ingegneria-mate-polito">GitHub</a>.</div>
  </aside>
  <main class="main">
    <div class="bar">
      <button class="btn" id="menu" aria-label="Insegnamenti">Corsi</button>
      <div class="title"><h1 id="vtitle">Tutto il percorso</h1><p id="vmeta"></p></div>
      <div class="tools">
        <button class="btn" id="back" hidden>Torna al percorso</button>
        <button class="btn zoom" id="zin" aria-label="Ingrandisci">+</button>
        <button class="btn zoom" id="zout" aria-label="Riduci">−</button>
        <button class="btn" id="fit">Centra</button>
      </div>
    </div>
    <canvas id="cv" aria-label="Grafo delle competenze"></canvas>
    <div class="hint" id="hint">Trascina per spostarti, rotella per lo zoom, clic su un nodo per i dettagli.</div>
    <section class="detail" id="detail" aria-live="polite">
      <div class="dhead"><div><h2 id="dname"></h2><div class="area" id="darea"></div></div><button class="btn" id="dclose" aria-label="Chiudi">✕</button></div>
      <div class="dbody" id="dbody"></div>
    </section>
  </main>
</div>
<noscript><p style="padding:24px">Questa pagina usa JavaScript per disegnare il grafo. Le note sono anche leggibili nella cartella Competenze della repo.</p></noscript>
<script defer src="data.js"></script>
<script defer src="brain.js"></script>
</body>
</html>
